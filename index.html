<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khady's Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav>
        <div class="logo"><strong>Khady's</strong></div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#menu">Menu<i class="fa-solid fa-angle-down"></i></a></li>
            <li><a href="#about">Orders</a></li>
            <li><a href="#outlet">Outlet</a></li>
        </ul>
        <div class="cart">
            <form class="search-form" action="/search" method="GET">
                <div class="search-box">
                    <input
                        type="text"
                        name="query"
                        placeholder="Search..."
                        aria-label="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </form>

            <div class="cart">
                <div class="ct">
                    <i class="fa-solid fa-shopping-cart"></i>
                </div>
            </div>
        </div>
    </nav>
   
    <section class="hero">
        <div class="text">
             <div class="welcome">
                <h3>Welcome</h3>
            </div>
            <div class="h-tag1">
                <h1>Enjoy Your</h1>
            </div>
            <div class="h-tag2">
                <h1>Delicious Foods</h1>
            </div>
            <button>Order Now</button>
        </div>
        <div class="burger-hero">
            <img src="burger-1.png" alt="Burger Hero Image">
        </div>
        <div class="services">
            <div class="delivery">
                <i class="fa-solid fa-truck-fast"></i>
                <h3>Fast Delivery</h3>
                <p>Get your food delivered quickly and safely</p>
            </div>
            <div class="pickup">
                <i class="fa-solid fa-truck-pickup"></i>
                <h3>Pick Up</h3>
                <p>Collect your order at your convenience</p>
            </div>
            <div class="Easy">
                <i class="fa-solid fa-bag-shopping"></i>
                <h3>Easy Order</h3>
                <p>Place your order with ease</p>
            </div>
        </div>
    </section>
        
    <section class="body">
        <div class="foods">
            <div class="breakfast">
                <img src="shawarma.jfif">
                <p>shawarma</p>
            </div>
            <div class="soup">
                <img src="soup.jfif">
                <p>soup</p>
            </div>
            <div class="snacks">
                <img src="sprimg-roll.jfif">
                <p>snacks</p>
            </div>
        </div>
    </section>
</body>
</html>
